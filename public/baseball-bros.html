<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Bros</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ── Retro pixel canvas: internal 480×270, upscaled ──
const W=480,H=270;
const cv=document.getElementById('c');
const cx=cv.getContext('2d');
function resize(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=Math.round(W*s)+'px';
  cv.style.height=Math.round(H*s)+'px';
  cv.width=W;cv.height=H;
}
resize();window.addEventListener('resize',resize);

// ── Retro palette ──
const C={
  sky1:'#5BA4CF',sky2:'#8BC8FF',
  grass1:'#4DA34D',grass2:'#3D8C3D',grass3:'#5CB85C',
  dirt:'#C8955A',dirt2:'#B07A40',
  white:'#FFFFFF',black:'#000000',
  yellow:'#FFD700',orange:'#FF8800',red:'#DD2222',
  blue:'#2255CC',lblue:'#4488FF',
  green:'#22AA44',
  grey:'#AAAAAA',dgrey:'#444444',
  brown:'#8B5A2B',
  skin:'#FFCC99',
  pink:'#FF88AA',
  ui_bg:'#1A1A2E',ui_border:'#FFD700',
  ui_text:'#FFFFFF',
  crowd1:'#FF6666',crowd2:'#66AAFF',crowd3:'#FFFF66',crowd4:'#AA66FF',
};

// ── Input ──
const keys={};
window.addEventListener('keydown',e=>{
  keys[e.code]=true; onKey(e.code);
  if(['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code))e.preventDefault();
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; onKeyUp(e.code); });
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const s=W/r.width;
  onClick((e.clientX-r.left)*s,(e.clientY-r.top)*s);
});

// ── Pixel draw primitives ──
function px(x,y,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),1,1);}
function rect(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function rectB(x,y,w,h,fc,bc){rect(x,y,w,h,fc);cx.strokeStyle=bc;cx.lineWidth=1;cx.strokeRect(Math.round(x)+0.5,Math.round(y)+0.5,Math.round(w)-1,Math.round(h)-1);}
function elli(x,y,rx,ry,c){cx.fillStyle=c;cx.beginPath();cx.ellipse(Math.round(x),Math.round(y),rx,ry,0,0,Math.PI*2);cx.fill();}
function txt(s,x,y,c,size,align){cx.fillStyle=c;cx.font=`bold ${size}px 'Courier New',monospace`;cx.textAlign=align||'left';cx.fillText(s,Math.round(x),Math.round(y));}
function txtS(s,x,y,c,sc,size,align){// with shadow
  txt(s,x+1,y+1,sc,size,align);txt(s,x,y,c,size,align);
}
function line(x1,y1,x2,y2,c,w){cx.strokeStyle=c;cx.lineWidth=w||1;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke();}

// ── Field geometry (3/4 overhead view) ──
// Diamond: home plate bottom-center, 1st right, 2nd top, 3rd left
const HOME  ={x:240,y:220};
const FIRST ={x:300,y:180};
const SECOND={x:240,y:140};
const THIRD ={x:180,y:180};
const MOUND ={x:240,y:172};

// ── Game state ──
let G;
function newGame(){
  G={
    state:'menu', // menu|pitching|incoming|batting|result|over
    score:[0,0],  // home,away
    inning:1, top:true,
    outs:0,strikes:0,balls:0,
    bases:[false,false,false],
    halfInnings:0,
    // ball
    ball:null,
    // pitch cursor (oscillating for pitcher aim)
    pitchCursor:0.5, pitchCursorDir:1, pitchCursorSpeed:0.018,
    pitchLocked:false, pitchPower:0.5,
    pitchTypeIdx:0,
    // swing cursor
    swingCursor:0.0, swingCursorDir:1, swingCursorSpeed:0.022,
    swingLocked:false,
    swingDone:false,
    // anims
    batterAnim:0, pitcherAnim:0,
    batAngle:0, batSwinging:false,
    pitchAnim:0, pitching:false,
    // particles
    particles:[],
    flashText:'', flashTimer:0, flashColor:C.yellow,
    // crowd wave
    crowdT:0,
    // menu
    menuT:0,
    clouds:[{x:60,y:30,w:50},{x:200,y:20,w:70},{x:360,y:35,w:55},{x:430,y:18,w:40}],
    // ai
    aiTimer:0,
  };
}

// Pitch types
const PITCHES=[
  {name:'FAST', color:'#FF4444',spd:0.052,break:0},
  {name:'CURVE',color:'#44AAFF',spd:0.032,break:18},
  {name:'SLIDE',color:'#44FF88',spd:0.040,break:10},
  {name:'CHNG', color:'#FFAA22',spd:0.022,break:6},
];

// ── Input handlers ──
function onKey(code){
  if(!G)return;
  if(code==='KeyR'){newGame();G.state='pitching';return;}
  if(G.state==='menu'&&['Space','ArrowUp','Enter'].includes(code)){G.state='pitching';return;}
  if(G.state==='pitching'){
    if((code==='Space'||code==='ArrowUp')&&!G.pitchLocked){
      G.pitchLocked=true; G.pitchPower=G.pitchCursor; throwPitch();
    }
    if(code==='ArrowLeft') G.pitchTypeIdx=(G.pitchTypeIdx+3)%4;
    if(code==='ArrowRight')G.pitchTypeIdx=(G.pitchTypeIdx+1)%4;
  }
  if((G.state==='incoming'||G.state==='batting')&&(code==='Space'||code==='ArrowUp')){
    if(!G.swingLocked&&!G.swingDone){
      G.swingLocked=true; doSwing(G.swingCursor);
    }
  }
}
function onKeyUp(code){}
function onClick(mx,my){
  if(!G)return;
  if(G.state==='menu'){G.state='pitching';return;}
  if(G.state==='pitching'){
    // check pitch type tabs
    for(let i=0;i<4;i++){
      if(mx>=8+i*58&&mx<=62+i*58&&my>=252&&my<=267){G.pitchTypeIdx=i;return;}
    }
    if(!G.pitchLocked){G.pitchLocked=true;G.pitchPower=G.pitchCursor;throwPitch();}
  }
  if((G.state==='incoming'||G.state==='batting')&&!G.swingLocked&&!G.swingDone){
    G.swingLocked=true;doSwing(G.swingCursor);
  }
}

// ── Throw pitch ──
function throwPitch(){
  G.state='incoming';
  G.pitching=true; G.pitchAnim=0;
  const pt=PITCHES[G.pitchTypeIdx];
  const isStr=Math.random()<(0.55+G.pitchPower*0.3);
  // Ball travels from mound to home plate area
  const ex=HOME.x+(isStr?(Math.random()-0.5)*20:(Math.random()-0.5)*48);
  const ey=HOME.y-14+(isStr?(Math.random()-0.5)*14:(Math.random()-0.5)*32);
  G.ball={
    x:MOUND.x,y:MOUND.y,
    ex,ey,
    t:0,spd:pt.spd,
    breakAmt:pt.break,
    spin:0,
    phase:'pitch',
    isStr,
    ptIdx:G.pitchTypeIdx,
    vx:0,vy:0,grav:0,
  };
  G.swingDone=false; G.swingLocked=false; G.swingCursor=0;
}

// ── Swing ──
function doSwing(cur){
  G.swingDone=true;
  G.batSwinging=true; G.batAngle=0;
  const b=G.ball;
  if(!b||b.phase!=='pitch'){miss();return;}
  const progress=b.t;
  // timing window: ball should be between 75-100% of travel
  const inWindow=progress>=0.72&&progress<=1.05;
  if(!inWindow){miss();return;}
  // cursor sweet spot ~0.42-0.68
  const sweet=cur>=0.38&&cur<=0.70;
  const ok=cur>=0.25&&cur<=0.82;
  const hitChance=sweet?0.92:ok?0.70:0.35;
  if(Math.random()>hitChance){miss();return;}
  // Hit!
  const quality=sweet?1.0:ok?0.7:0.45;
  const aimDir=keys['ArrowLeft']?-1:keys['ArrowRight']?1:0;
  hit(quality,aimDir);
}

function miss(){
  G.batSwinging=true; G.batAngle=0;
  G.strikes++;
  flash('STRIKE!',C.red,50);
  if(G.strikes>=3){doOut('STRIKEOUT!');}
  else setTimeout(()=>resetPitch(false),800);
}

function hit(q,dir){
  flash(q>0.85?'PERFECT!':q>0.6?'GREAT!':'GOOD!',C.yellow,70);
  // Determine result
  let result,adv;
  const r=Math.random();
  if(q>0.9&&r<0.22){result='HOME RUN!!';adv=4;bigFlash();}
  else if(q>0.75&&r<0.5){result='TRIPLE!';adv=3;}
  else if(q>0.5){result='DOUBLE!';adv=2;}
  else{result='SINGLE!';adv=1;}
  setTimeout(()=>flash(result,adv===4?C.yellow:C.white,90),300);
  advanceBases(adv);
  // launch ball
  const angle=-1.2+dir*0.4+(Math.random()-0.5)*0.35;
  const spd=(5+q*10);
  G.ball={x:HOME.x,y:HOME.y-10,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd-2,spin:0,phase:'hit',grav:0.18,t:1,spd:0,breakAmt:0,ex:0,ey:0,isStr:false,ptIdx:0};
  spawnStars(HOME.x,HOME.y-10,adv===4?30:15);
  setTimeout(()=>{G.ball=null;resetPitch(true);},1800);
}

function bigFlash(){
  spawnStars(W/2,H/2-30,50);
}

function doOut(msg){
  flash(msg,C.red,90);
  G.outs++;
  if(G.outs>=3)setTimeout(nextHalf,1500);
  else setTimeout(()=>resetPitch(true),1200);
}

function nextHalf(){
  G.halfInnings++;
  if(G.halfInnings>=18){endGame();return;}
  G.top=!G.top; if(G.top)G.inning++;
  G.outs=0;G.bases=[false,false,false];
  flash(G.top?`INNING ${G.inning}`:` BOTTOM ${G.inning}`,C.yellow,100);
  setTimeout(()=>resetPitch(true),1800);
}

function endGame(){
  G.state='over';
  flash(G.score[0]>G.score[1]?'HOME WINS!':G.score[1]>G.score[0]?'AWAY WINS!':'TIE GAME!',C.yellow,500);
}

function advanceBases(n){
  let runs=0;
  const nb=[...G.bases];
  for(let b=2;b>=0;b--){
    if(!nb[b])continue;
    if(b+n>=3){runs++;nb[b]=false;}
    else{nb[b]=false;nb[b+n]=true;}
  }
  if(n>=4)runs++;
  else if(n-1>=0&&n-1<3)nb[n-1]=true;
  G.bases=nb;
  G.score[G.top?1:0]+=runs;
  if(runs>0)spawnStars(HOME.x,HOME.y-20,runs*10);
}

function resetPitch(full){
  G.ball=null;
  G.pitchLocked=false;G.pitchCursor=0.5;
  G.swingLocked=false;G.swingCursor=0;G.swingDone=false;
  G.pitching=false;G.batSwinging=false;G.batAngle=0;
  if(full){G.strikes=0;G.balls=0;}
  if(G.state!=='over')G.state='pitching';
}

function flash(msg,col,t){G.flashText=msg;G.flashColor=col;G.flashTimer=t;}

// ── Particles ──
function spawnStars(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*5;
    const colors=[C.yellow,C.orange,C.white,'#FF88FF','#88FFFF'];
    G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:40+Math.random()*30,
      color:colors[Math.floor(Math.random()*colors.length)],size:Math.floor(Math.random()*3)+1});
  }
}

// ── DRAW ROUTINES ──

function drawField(){
  // Sky
  rect(0,0,W,H,C.sky1);
  // Sky gradient bands
  for(let i=0;i<60;i++){
    const t=i/60;
    const r=Math.round(91+t*(135-91)),g=Math.round(164+t*(200-164)),b=Math.round(207+t*(255-207));
    rect(0,i,W,1,`rgb(${r},${g},${b})`);
  }

  // Clouds (pixel style)
  G.clouds.forEach(cl=>{
    cl.x-=0.05;if(cl.x<-cl.w)cl.x=W+cl.w;
    const cw=cl.w,cx2=cl.x,cy=cl.y;
    rect(cx2+4,cy+4,cw-8,8,C.white);
    rect(cx2,cy+8,cw,8,C.white);
    rect(cx2+cw*0.2,cy,cw*0.3,8,C.white);
    rect(cx2+cw*0.55,cy+2,cw*0.25,8,C.white);
  });

  // Stands background
  rect(0,60,W,55,'#3A5A8A');
  // Stand rows
  for(let r=0;r<4;r++){
    rect(0,62+r*12,W,10,r%2===0?'#2A4A7A':'#3A5A8A');
  }
  // Stand rail
  rect(0,108,W,4,'#AA8855');
  rect(0,109,W,2,'#FFCC88');

  // Crowd (pixel people in stands)
  const crowdColors=[C.crowd1,C.crowd2,C.crowd3,C.crowd4,'#88FF88','#FF88FF'];
  for(let i=0;i<48;i++){
    const px2=10+i*10;
    const row=i%4;
    const py=64+row*11;
    const col=crowdColors[(i*7+row*3)%crowdColors.length];
    const wave=Math.sin(Date.now()*0.002+i*0.6)*(i%5===0?3:0.5);
    // body
    rect(px2,py+3+wave,7,7,col);
    // head
    rect(px2+1,py-1+wave,5,5,C.skin);
    // wave arm
    if(i%5===0)rect(px2+6,py-2+wave,3,3,col);
  }

  // Big outfield grass
  rect(0,112,W,H,'#3D8C3D');

  // Grass pattern stripes
  for(let i=0;i<8;i++){
    const yy=112+i*20;
    rect(0,yy,W,10,i%2===0?'#4DA34D':'#3D8C3D');
  }

  // ── Diamond ──
  // Draw infield dirt as filled polygon
  cx.fillStyle=C.dirt;
  cx.beginPath();
  cx.moveTo(HOME.x,HOME.y+8);
  cx.lineTo(FIRST.x+8,FIRST.y+4);
  cx.lineTo(SECOND.x,SECOND.y-4);
  cx.lineTo(THIRD.x-8,THIRD.y+4);
  cx.closePath();cx.fill();
  // Inner diamond darker
  cx.fillStyle=C.dirt2;
  cx.beginPath();
  const shrink=10;
  cx.moveTo(HOME.x,HOME.y+4-shrink);
  cx.lineTo(FIRST.x+4-shrink,FIRST.y+2);
  cx.lineTo(SECOND.x,SECOND.y+shrink);
  cx.lineTo(THIRD.x-4+shrink,THIRD.y+2);
  cx.closePath();cx.fill();

  // Pitcher mound
  elli(MOUND.x,MOUND.y,12,6,'#C09060');
  elli(MOUND.x,MOUND.y,8,4,'#D0A070');

  // Base lines (white pixel lines)
  cx.strokeStyle=C.white; cx.lineWidth=1.5;
  cx.setLineDash([3,3]);
  cx.beginPath();cx.moveTo(HOME.x,HOME.y);cx.lineTo(FIRST.x,FIRST.y);cx.stroke();
  cx.beginPath();cx.moveTo(HOME.x,HOME.y);cx.lineTo(THIRD.x,THIRD.y);cx.stroke();
  cx.beginPath();cx.moveTo(FIRST.x,FIRST.y);cx.lineTo(SECOND.x,SECOND.y);cx.stroke();
  cx.beginPath();cx.moveTo(THIRD.x,THIRD.y);cx.lineTo(SECOND.x,SECOND.y);cx.stroke();
  cx.setLineDash([]);

  // Foul lines extending out
  cx.strokeStyle='rgba(255,255,255,0.4)';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(HOME.x,HOME.y);cx.lineTo(HOME.x+120,HOME.y-70);cx.stroke();
  cx.beginPath();cx.moveTo(HOME.x,HOME.y);cx.lineTo(HOME.x-120,HOME.y-70);cx.stroke();

  // Bases
  drawBase(FIRST.x, FIRST.y, G.bases[0]);
  drawBase(SECOND.x,SECOND.y,G.bases[1]);
  drawBase(THIRD.x, THIRD.y, G.bases[2]);

  // Home plate (pentagon)
  cx.fillStyle=C.white;
  cx.beginPath();
  cx.moveTo(HOME.x-5,HOME.y);cx.lineTo(HOME.x+5,HOME.y);
  cx.lineTo(HOME.x+5,HOME.y+5);cx.lineTo(HOME.x,HOME.y+8);
  cx.lineTo(HOME.x-5,HOME.y+5);cx.closePath();cx.fill();

  // Strike zone
  if(G.state==='pitching'||G.state==='incoming'||G.state==='batting'){
    cx.strokeStyle='rgba(255,255,255,0.4)';cx.lineWidth=1;cx.setLineDash([2,2]);
    cx.strokeRect(HOME.x-10,HOME.y-36,20,28);
    cx.setLineDash([]);
  }
}

function drawBase(x,y,occupied){
  cx.save();cx.translate(x,y);cx.rotate(Math.PI/4);
  rect(-5,-5,10,10,occupied?C.yellow:C.white);
  if(occupied){cx.strokeStyle='#FF8800';cx.lineWidth=1.5;cx.strokeRect(-5,-5,10,10);}
  cx.restore();
}

// ── Pixel art characters ──

// Batter: big head, chunky body, side-facing toward pitcher
function drawBatter(){
  const bx=HOME.x-30, by=HOME.y-8;
  const swing=G.batSwinging;
  let ba=G.batAngle;
  if(swing){ba=Math.min(ba+0.18,1.8);G.batAngle=ba;}

  cx.save();cx.translate(bx,by);

  // Shadow
  elli(8,4,14,4,'rgba(0,0,0,0.25)');

  // Legs (pixel blocks)
  rect(2,-16,7,16,'#1A3A9A');  // left leg
  rect(11,-16,7,16,'#1A3A9A'); // right leg
  rect(0,-2,9,6,'#111');       // shoe L
  rect(9,-2,9,6,'#111');       // shoe R

  // Body
  rect(-2,-38,22,22,'#2255CC'); // jersey
  // number on jersey
  rect(6,-34,3,8,'#AABBFF');
  rect(11,-34,3,8,'#AABBFF');

  // Head
  rect(-1,-58,20,20,C.skin);   // head
  // eye
  rect(12,-52,4,4,'#111');
  rect(13,-51,2,2,C.white);
  // mouth (determined look)
  rect(10,-45,6,2,'#AA3333');

  // Helmet
  rect(-3,-60,22,14,'#1A2A9A'); // helmet body
  rect(-3,-61,22,4,'#111A7A');  // top
  rect(16,-60,6,12,'#1A2A9A'); // ear flap

  // Bat (rotate around grip point)
  cx.save();cx.translate(0,-22);cx.rotate(-1.2+ba);
  rect(-3,-2,4,4,'#111');      // grip wrap
  rect(-2,-28,4,26,'#8B5A2B'); // handle
  // barrel
  cx.fillStyle='#C4783A';
  cx.beginPath();cx.ellipse(0,-30,6,10,0,0,Math.PI*2);cx.fill();
  rect(-6,-30,12,8,'#C4783A');
  cx.restore();

  cx.restore();
}

// Pitcher: faces batter (mirrored), on mound
function drawPitcher(){
  const px2=MOUND.x, py=MOUND.y-8;
  const throwAnim=G.pitchAnim;
  const armAngle=G.pitching? Math.min(throwAnim*0.15,-0.3+throwAnim*0.18)*-1 : -0.5;

  cx.save();cx.translate(px2,py);cx.scale(-1,1); // face left toward batter

  elli(0,4,12,4,'rgba(0,0,0,0.22)');

  // Legs
  rect(2,-16,7,16,'#9A1A1A');
  rect(11,-16,7,16,'#9A1A1A');
  rect(0,-2,9,6,'#111');
  rect(9,-2,9,6,'#111');

  // Body
  rect(-2,-38,22,22,'#CC2222');
  rect(6,-34,3,8,'#FFAAAA');
  rect(11,-34,3,8,'#FFAAAA');

  // Head
  rect(-1,-58,20,20,C.skin);
  rect(12,-52,4,4,'#111');
  rect(13,-51,2,2,C.white);
  rect(8,-45,7,2,'#AA3333');

  // Cap (pitcher wears a cap not helmet)
  rect(-3,-60,22,10,'#AA1111');
  rect(-3,-61,22,3,'#880000');
  rect(-8,-57,6,6,'#AA1111'); // brim

  // Throwing arm
  cx.save();cx.translate(20,-30);cx.rotate(armAngle);
  rect(-3,-24,6,24,C.skin);  // arm
  // Glove
  cx.fillStyle='#8B5A2B';cx.beginPath();cx.ellipse(0,-26,7,9,0,0,Math.PI*2);cx.fill();
  cx.restore();

  cx.restore();
  if(G.pitching)G.pitchAnim++;
}

// ── Ball ──
function drawBall(){
  const b=G.ball;if(!b)return;
  b.spin+=0.25;

  if(b.phase==='pitch'){
    b.t=Math.min(b.t+b.spd,1);
    // Lerp from mound to plate with arc and break
    const t=b.t;
    const arc=-Math.sin(t*Math.PI)*20; // arc upward mid-flight
    const brk=Math.sin(t*Math.PI)*b.breakAmt*(Math.random()<0.5?1:-1)*0.03;
    b.x=MOUND.x+(b.ex-MOUND.x)*t + brk;
    b.y=MOUND.y+(b.ey-MOUND.y)*t + arc;

    if(b.t>=1&&!G.swingDone){
      // No swing — call it
      if(b.isStr){G.strikes++;flash('STRIKE!',C.red,55);if(G.strikes>=3)doOut('STRIKEOUT!');else setTimeout(()=>resetPitch(false),700);}
      else{G.balls++;flash('BALL!',C.green,55);if(G.balls>=4){flash('WALK!',C.white,80);advanceBases(1);G.strikes=0;G.balls=0;setTimeout(()=>resetPitch(true),900);}else setTimeout(()=>resetPitch(false),700);}
    }
  } else {
    b.x+=b.vx;b.y+=b.vy;b.vy+=b.grav;
  }

  // Shadow on ground
  if(b.phase==='pitch'){
    const gx=b.x,gy=HOME.y+2;
    elli(gx,gy,4,1.5,'rgba(0,0,0,0.3)');
  }

  // Ball sprite (7px pixel circle)
  const bx=Math.round(b.x),by=Math.round(b.y);
  // Pixel ball (hand-drawn 7-wide circle)
  const ballPx=[
    [1,0,5,1],[0,1,7,3],[0,4,7,3],[1,6,5,1], // outline
  ];
  cx.fillStyle=C.white;
  cx.beginPath();cx.arc(bx,by,5,0,Math.PI*2);cx.fill();
  // Seams
  cx.save();cx.translate(bx,by);cx.rotate(b.spin);
  cx.strokeStyle='#CC3333';cx.lineWidth=1;
  cx.beginPath();cx.arc(0,0,3.5,0.5,2.3);cx.stroke();
  cx.beginPath();cx.arc(0,0,3.5,Math.PI+0.5,Math.PI+2.3);cx.stroke();
  cx.restore();

  // Pitch type colored glow
  if(b.phase==='pitch'&&b.t<0.5){
    const col=PITCHES[b.ptIdx].color;
    cx.fillStyle=col+'44';
    cx.beginPath();cx.arc(bx,by,8,0,Math.PI*2);cx.fill();
  }
}

// ── HUD ──
function drawHUD(){
  // Top score bar
  rect(0,0,W,16,'#1A1A2E');
  rect(0,15,W,1,C.yellow);

  // Score
  txtS(`HOME:${G.score[0]}`,4,12,C.yellow,'#000',9,'left');
  txtS(`AWAY:${G.score[1]}`,W-60,12,C.red,'#000',9,'left');

  // Inning
  const arr=G.top?'▲':'▼';
  txtS(`${arr}${G.inning}`,W/2-14,12,C.white,'#000',9,'left');

  // Outs dots
  for(let i=0;i<3;i++){
    elli(W/2+22+i*10,8,3,3,i<G.outs?C.red:C.dgrey);
  }

  // Count
  txtS(`B:${G.balls}`,W/2+56,12,C.green,'#000',9,'left');
  txtS(`S:${G.strikes}`,W/2+76,12,C.orange,'#000',9,'left');

  // Pitch type bar (bottom)
  if(G.state==='pitching'){
    rect(0,250,W,H-250,'#0A0A1E');
    rect(0,250,W,1,'#444466');
    PITCHES.forEach((p,i)=>{
      const bx=8+i*58,by=253,bw=54,bh=14;
      const sel=G.pitchTypeIdx===i;
      rect(bx,by,bw,bh,sel?p.color:'#222244');
      if(sel){cx.strokeStyle=C.yellow;cx.lineWidth=1;cx.strokeRect(bx+0.5,by+0.5,bw-1,bh-1);}
      txtS(p.name,bx+bw/2,by+10,sel?C.black:C.grey,'#000',8,'center');
    });
    // Prompt
    txtS('← → PITCH TYPE   |   ▲ or CLICK = THROW',W/2,248,C.grey,'#000',8,'center');
  }

  // Swing cursor bar
  if(G.state==='incoming'||G.state==='batting'){
    // Pitch label
    txt(PITCHES[G.ball?G.ball.ptIdx:0].name, W/2,248,PITCHES[G.ball?G.ball.ptIdx:0].color,9,'center');

    const bx=80,by=254,bw=320,bh=12;
    rect(0,250,W,H-250,'#0A0A1E');
    rect(0,250,W,1,'#444466');
    // Track BG
    rect(bx,by,bw,bh,'#222244');
    cx.strokeStyle='#444466';cx.lineWidth=1;cx.strokeRect(bx+0.5,by+0.5,bw-1,bh-1);
    // Sweet zone highlight
    rect(bx+bw*0.38,by,bw*0.3,bh,'#224422');
    // Stars in sweet spot
    txtS('★',bx+bw*0.38+bw*0.15-3,by+10,C.yellow,'#000',8,'center');
    // cursor
    const curX=bx+G.swingCursor*bw;
    rect(curX-1,by-1,3,bh+2,C.yellow);
    cx.strokeStyle=C.yellow;cx.lineWidth=1;cx.strokeRect(curX-2,by-2,5,bh+4);
    // Label
    txtS('SWING TIMING: ▲/SPACE',W/2,248,C.yellow,'#000',8,'center');
  }

  // Flash text (big center)
  if(G.flashTimer>0){
    G.flashTimer--;
    const alpha=Math.min(1,G.flashTimer/15);
    cx.globalAlpha=alpha;
    const fs=G.flashText.includes('!!')?20:G.flashText.length>8?14:18;
    txtS(G.flashText,W/2,H/2-10,G.flashColor,'#000',fs,'center');
    cx.globalAlpha=1;
  }

  // Game over
  if(G.state==='over'){
    cx.fillStyle='rgba(0,0,0,0.6)';cx.fillRect(0,0,W,H);
    rect(W/2-80,H/2-35,160,70,'#1A1A2E');
    cx.strokeStyle=C.yellow;cx.lineWidth=2;cx.strokeRect(W/2-80,H/2-35,160,70);
    txtS('GAME OVER',W/2,H/2-15,C.yellow,'#000',16,'center');
    txtS(`${G.score[0]}-${G.score[1]}`,W/2,H/2+8,C.white,'#000',20,'center');
    txtS('R = PLAY AGAIN',W/2,H/2+26,C.grey,'#000',8,'center');
  }
}

// ── Particles ──
function drawParticles(){
  G.particles=G.particles.filter(p=>p.life>0);
  G.particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=2;
    cx.globalAlpha=p.life/70;
    rect(p.x,p.y,p.size,p.size,p.color);
    cx.globalAlpha=1;
  });
}

// ── Menu ──
function drawMenu(){
  // Animated sky BG
  rect(0,0,W,H,'#1A1A4E');
  // Stars
  for(let i=0;i<60;i++){
    const bx=(i*173+77)%W, by=(i*97+33)%(H*0.55);
    const tw=Math.sin(Date.now()*0.001+i)*0.5+0.5;
    cx.fillStyle=`rgba(255,255,255,${tw*0.8})`;
    cx.fillRect(Math.round(bx),Math.round(by),1,1);
  }

  // Ground
  rect(0,H*0.68,W,H,'#1A5A1A');
  rect(0,H*0.68,W,3,'#2A8A2A');

  G.menuT=(G.menuT||0)+0.04;
  const pulse=Math.floor(Math.sin(G.menuT)*2);

  // Title box
  rect(W/2-110,28,220,52,'#0A0A2E');
  cx.strokeStyle=C.yellow;cx.lineWidth=2;cx.strokeRect(W/2-110,28,220,52);
  cx.strokeStyle='#8855FF';cx.lineWidth=1;cx.strokeRect(W/2-108,30,216,48);

  // BASEBALL text (big pixel letters)
  txtS('BASEBALL',W/2,55,C.yellow,'#442200',20,'center');
  txtS('BROS',W/2,74,C.red,'#440000',16,'center');

  // Bouncing ball
  const ballY=90+Math.sin(G.menuT*2)*6;
  drawBallAt(W/2,ballY,G.menuT*3);

  // Two characters
  cx.save();cx.translate(W/2-70,H*0.72);
  drawMenuChar('#2255CC','#1A2A8A',false);cx.restore();
  cx.save();cx.translate(W/2+70,H*0.72);
  drawMenuChar('#CC2222','#8A1A1A',true);cx.restore();

  // Play button
  const pb={x:W/2-60,y:H-70,w:120,h:26};
  rect(pb.x,pb.y,pb.w,pb.h,'#CC2222');
  cx.strokeStyle=C.yellow;cx.lineWidth=2;cx.strokeRect(pb.x,pb.y,pb.w,pb.h);
  rect(pb.x+2,pb.y+2,pb.w-4,3,'rgba(255,255,255,0.3)');
  txtS('▶ PLAY BALL!',W/2,pb.y+17,C.white,'#000',10,'center');

  // Controls
  txtS('CLICK · ▲ ARROW · ENTER',W/2,H-34,C.grey,'#000',8,'center');
  txtS('▲=PITCH  SPACE=SWING  ←→=AIM  R=RESTART',W/2,H-20,C.dgrey,'#000',7,'center');
}

function drawBallAt(x,y,spin){
  cx.save();cx.translate(Math.round(x),Math.round(y));
  cx.fillStyle=C.white;cx.beginPath();cx.arc(0,0,5,0,Math.PI*2);cx.fill();
  cx.rotate(spin);cx.strokeStyle='#CC3333';cx.lineWidth=1;
  cx.beginPath();cx.arc(0,0,3.5,0.5,2.3);cx.stroke();
  cx.beginPath();cx.arc(0,0,3.5,Math.PI+0.5,Math.PI+2.3);cx.stroke();
  cx.restore();
}

function drawMenuChar(body,hat,flip){
  if(flip)cx.scale(-1,1);
  // legs
  rect(-8,-30,7,30,'#333');rect(2,-30,7,30,'#333');
  rect(-10,-6,10,8,'#111');rect(1,-6,10,8,'#111');
  // body
  rect(-12,-60,26,30,body);
  // head (big pixel head!)
  rect(-14,-92,28,32,C.skin);
  // eyes
  rect(4,-84,5,5,'#111');rect(5,-83,3,3,C.white);
  // smile
  rect(0,-76,10,2,'#CC3333');rect(-3,-75,3,2,'#CC3333');
  // hat
  rect(-14,-98,28,10,hat);rect(-10,-108,20,12,hat);
  rect(-16,-96,4,8,hat); // brim
}

// ── Swing cursor oscillation ──
function updateCursors(){
  if(G.state==='pitching'&&!G.pitchLocked){
    G.pitchCursor+=G.pitchCursorDir*G.pitchCursorSpeed;
    if(G.pitchCursor>=1){G.pitchCursor=1;G.pitchCursorDir=-1;}
    if(G.pitchCursor<=0){G.pitchCursor=0;G.pitchCursorDir=1;}
  }
  if((G.state==='incoming'||G.state==='batting')&&!G.swingLocked){
    G.swingCursor+=G.swingCursorDir*G.swingCursorSpeed;
    if(G.swingCursor>=1){G.swingCursor=1;G.swingCursorDir=-1;}
    if(G.swingCursor<=0){G.swingCursor=0;G.swingCursorDir=1;}
  }
  // switch to batting state once ball is thrown
  if(G.state==='incoming'&&G.ball&&G.ball.t>0.3&&!G.swingDone){
    G.state='batting';
  }
}

// ── Pitch cursor visual (shown during pitching state) ──
function drawPitchCursor(){
  if(G.state!=='pitching'||G.pitchLocked)return;
  // Show a cursor bouncing along the pitch power bar at bottom
  // (shown in the HUD drawHUD handles the bar; here we show it on field)
  // Aim indicator in strike zone
  const sz={x:HOME.x-10,y:HOME.y-36,w:20,h:28};
  const cx2=sz.x+G.pitchCursor*sz.w;
  const cy=sz.y+0.5*sz.h;
  rect(cx2-1,sz.y,2,sz.h,'rgba(255,220,0,0.6)');
  elli(cx2,cy,3,3,C.yellow);
}

// ── Main loop ──
function loop(){
  requestAnimationFrame(loop);
  if(!G)return;
  cx.imageSmoothingEnabled=false;
  cx.clearRect(0,0,W,H);

  if(G.state==='menu'){drawMenu();return;}

  updateCursors();
  drawField();
  drawPitchCursor();
  drawPitcher();
  drawBatter();
  if(G.ball)drawBall();
  drawParticles();
  drawHUD();

  G.crowdT+=0.02;
}

newGame();
loop();
</script>
