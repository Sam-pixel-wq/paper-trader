<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baseball Bros</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; }
body { display:flex; align-items:center; justify-content:center; font-family:'Arial Black',Arial,sans-serif; }
canvas { display:block; image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Fixed 800x500 design, letterboxed
const DW = 800, DH = 500;
function resize() {
  const s = Math.min(window.innerWidth/DW, window.innerHeight/DH);
  canvas.width  = DW;
  canvas.height = DH;
  canvas.style.width  = Math.floor(DW*s)+'px';
  canvas.style.height = Math.floor(DH*s)+'px';
}
resize();
window.addEventListener('resize', resize);

// ── Input ──
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  onKey(e.code);
  if (['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('click', e => {
  const s = parseFloat(canvas.style.width) / DW;
  onClick(e.clientX/s, e.clientY/s);
});

// ── State machine ──
// states: menu, pitching, aiming, thrown, batting, result, gameover
let G;
function newGame() {
  G = {
    state: 'menu',
    score: [0, 0],      // [home, away]
    inning: 1, top: true,
    outs: 0, strikes: 0, balls: 0,
    bases: [null, null, null],
    halfInnings: 0,
    // pitch power bar
    pitchPower: 0, pitchDir: 1, pitchHeld: false,
    pitchType: 0,       // 0=fastball 1=curve 2=slider 3=changeup
    pitchReleased: false,
    pitchAngle: 0,      // where pitcher aims (0=centre, neg=high, pos=low)
    // ball in flight
    ball: null,
    // swing
    swingPower: 0, swingDir: 1, swingHeld: false, swingDone: false, swingReleased: false,
    // anim
    batterState: 'idle',   // idle, windup, swing, celebrate, out
    pitcherState: 'idle',  // idle, windup, throw
    batterFrame: 0,
    pitcherFrame: 0,
    // crowd
    crowd: makeCrowd(),
    // particles / hit text
    particles: [],
    hitText: null,
    hitTextTimer: 0,
    // misc
    menuPulse: 0,
    msg: '', msgTimer: 0,
    stadium: makeStadium(),
    aiTimer: 0,
  };
}

function makeCrowd() {
  return Array.from({length:80}, (_,i) => ({
    x: 30 + Math.random()*740,
    y: 38 + Math.random()*52,
    hue: Math.random()*360,
    wave: Math.random()*6.28,
    arm: Math.random() < 0.3,
    size: 7 + Math.random()*5,
  }));
}

function makeStadium() {
  // Random ad billboard texts
  return ['SODA KING','HOT DOGS','MEGA COLA','SPORTS+','GO TEAM!'];
}

// ── Pitch types ──
const PITCHES = [
  { name:'FASTBALL',  color:'#FF4444', speed:7.5, breakX:0,    breakY:0,    strikeP:0.72 },
  { name:'CURVEBALL', color:'#4488FF', speed:5.0, breakX:-1.8, breakY:1.2,  strikeP:0.58 },
  { name:'SLIDER',    color:'#44FF88', speed:6.0, breakX:-1.2, breakY:0.4,  strikeP:0.64 },
  { name:'CHANGEUP',  color:'#FFAA22', speed:4.0, breakX:0.3,  breakY:0.6,  strikeP:0.60 },
];

// ── Layout constants (design px) ──
// Side view: pitcher on right, batter on left, field receding into BG
const GROUND_Y   = 380;
const BATTER_X   = 180;
const PITCHER_X  = 580;
const STRIKE_ZONE = { x: BATTER_X+20, y: GROUND_Y-155, w: 52, h: 90 };

// ── onKey / onClick ──
function onKey(code) {
  if (!G) return;
  if (code==='KeyR') { newGame(); G.state='pitching'; return; }

  if (G.state==='menu') {
    if (['Space','ArrowUp','Enter'].includes(code)) { G.state='pitching'; return; }
  }
  if (G.state==='pitching') {
    if (code==='Space' || code==='ArrowUp') startPitchHold();
    if (code==='ArrowLeft')  G.pitchType = (G.pitchType+3)%4;
    if (code==='ArrowRight') G.pitchType = (G.pitchType+1)%4;
  }
  if (G.state==='batting') {
    if (code==='Space' || code==='ArrowUp') startSwingHold();
  }
}
window.addEventListener('keyup', e => {
  if (G && G.state==='pitching' && G.pitchHeld && (e.code==='Space'||e.code==='ArrowUp')) releasePitch();
  if (G && G.state==='batting'  && G.swingHeld && (e.code==='Space'||e.code==='ArrowUp')) releaseSwing();
});

function onClick(mx, my) {
  if (!G) return;
  if (G.state==='menu') { G.state='pitching'; return; }
  if (G.state==='pitching') {
    // check pitch type buttons
    for (let i=0;i<4;i++) {
      const bx=20+i*90, by=450;
      if (mx>=bx && mx<=bx+80 && my>=by && my<=by+32) { G.pitchType=i; return; }
    }
    startPitchHold();
  }
  if (G.state==='batting') startSwingHold();
}

// ── Pitch hold mechanic ──
function startPitchHold() {
  if (G.pitchHeld || G.pitchReleased) return;
  G.pitchHeld = true;
  G.pitchPower = 0;
  G.pitchDir = 1;
}
function releasePitch() {
  if (!G.pitchHeld) return;
  G.pitchHeld = false;
  G.pitchReleased = true;
  throwPitch(G.pitchPower);
}

function throwPitch(power) {
  G.state = 'thrown';
  G.pitcherState = 'throw';
  G.pitcherFrame = 0;

  const pt = PITCHES[G.pitchType];
  const isStrike = Math.random() < (pt.strikeP * (0.6 + power*0.4));

  // Ball starts at pitcher's hand
  const startX = PITCHER_X - 30;
  const startY = GROUND_Y - 140;

  // Target: strike zone centre or outside
  const szCx = STRIKE_ZONE.x + STRIKE_ZONE.w/2;
  const szCy = STRIKE_ZONE.y + STRIKE_ZONE.h/2;
  const tx = isStrike ? szCx + (Math.random()-0.5)*STRIKE_ZONE.w*0.7
                      : szCx + (Math.random()-0.5)*STRIKE_ZONE.w*2;
  const ty = isStrike ? szCy + (Math.random()-0.5)*STRIKE_ZONE.h*0.7
                      : szCy + (Math.random()-0.5)*STRIKE_ZONE.h*2;

  const frames = Math.round(50 - power*18); // faster with more power

  G.ball = {
    x: startX, y: startY,
    sx: startX, sy: startY,
    tx, ty,
    breakX: pt.breakX * power,
    breakY: pt.breakY * power,
    frame: 0, totalFrames: frames,
    speed: pt.speed,
    spin: 0,
    phase: 'pitch',
    isStrike,
    power,
    pitchIdx: G.pitchType,
    // hit trajectory
    vx:0, vy:0, grav:0,
  };
}

// ── Swing hold mechanic ──
function startSwingHold() {
  if (G.swingHeld || G.swingDone) return;
  G.swingHeld = true;
  G.swingPower = 0;
  G.swingDir = 1;
  G.batterState = 'windup';
}
function releaseSwing() {
  if (!G.swingHeld) return;
  G.swingHeld = false;
  G.swingReleased = true;
  G.swingDone = true;
  G.batterState = 'swing';
  G.batterFrame = 0;
  resolveSwing(G.swingPower);
}

function resolveSwing(power) {
  const b = G.ball;
  if (!b || b.phase !== 'pitch') {
    missSwing(); return;
  }
  // How close to the plate?
  const progress = b.frame / b.totalFrames;
  const inZone = progress >= 0.72 && progress <= 1.05;
  const ballInStrike = b.isStrike;

  if (!inZone) { missSwing(); return; }

  // Hit!
  const contact = ballInStrike ? (0.5 + power*0.5) : (0.2 + power*0.3);
  const hitRoll = Math.random();
  if (hitRoll > contact) { missSwing(); return; }

  // Determine hit quality
  const q = power * (0.6 + Math.random()*0.4);
  let result, advance;
  if      (q > 0.88 && Math.random()<0.18) { result='HOME RUN! 🏠'; advance=4; }
  else if (q > 0.72) { result='TRIPLE!';  advance=3; }
  else if (q > 0.52) { result='DOUBLE!';  advance=2; }
  else               { result='SINGLE!';  advance=1; }

  G.hitText = result;
  G.hitTextTimer = 120;
  G.batterState = 'celebrate';

  // Launch ball
  const dir = keys['ArrowLeft'] ? -1 : keys['ArrowRight'] ? 1 : 0;
  const angle = -1.1 - dir*0.35 + (Math.random()-0.5)*0.3;
  const spd = 8 + q*12;
  G.ball = {
    x: BATTER_X+30, y: GROUND_Y-120,
    vx: Math.cos(angle)*spd,
    vy: Math.sin(angle)*spd,
    spin: 0, phase:'hit', grav:0.32,
    sx:0, sy:0, tx:0, ty:0, frame:0, totalFrames:0,
    isStrike:false, power:0, pitchIdx:0, breakX:0, breakY:0,
  };

  advanceBases(advance);
  spawnHitParticles(BATTER_X+30, GROUND_Y-120, advance===4?'#FFD700':'#FFFFFF');
  setTimeout(()=>{ G.ball=null; resetAtBat(true); }, 2200);
}

function missSwing() {
  G.batterState = 'idle';
  G.strikes++;
  G.hitText = 'STRIKE!';
  G.hitTextTimer = 60;
  if (G.strikes >= 3) { doOut('STRIKEOUT!'); }
  else resetAtBat(false);
}

function doOut(msg) {
  G.hitText = msg;
  G.hitTextTimer = 90;
  G.batterState = 'out';
  G.outs++;
  if (G.outs >= 3) setTimeout(nextHalf, 1800);
  else setTimeout(()=>resetAtBat(true), 1500);
}

function nextHalf() {
  G.halfInnings++;
  if (G.halfInnings >= 18) { endGame(); return; }
  G.top = !G.top;
  if (G.top) G.inning++;
  G.outs=0; G.bases=[null,null,null];
  G.hitText = G.top ? `INNING ${G.inning} ▲` : `INNING ${G.inning} ▼`;
  G.hitTextTimer = 120;
  setTimeout(()=>resetAtBat(true),2000);
}

function endGame() {
  G.hitText = G.score[0]>G.score[1]?'HOME WINS! 🏆':G.score[1]>G.score[0]?'AWAY WINS! 🏆':'TIE!';
  G.hitTextTimer = 400;
  G.state = 'gameover';
}

function advanceBases(n) {
  let runs=0;
  const nb=[...G.bases];
  for (let b=2;b>=0;b--) {
    if (!nb[b]) continue;
    if (b+n>=3) { runs++; nb[b]=null; }
    else { nb[b]=null; nb[b+n]='runner'; }
  }
  if (n>=4) runs++;
  else if (n-1<3) nb[n-1]='runner';
  G.bases=nb;
  const team = G.top ? 1 : 0;
  G.score[team]+=runs;
}

function resetAtBat(full) {
  G.ball=null;
  G.pitchHeld=false; G.pitchReleased=false; G.pitchPower=0;
  G.swingHeld=false; G.swingReleased=false; G.swingPower=0; G.swingDone=false;
  G.pitcherState='idle'; G.batterState='idle';
  if (full) { G.strikes=0; G.balls=0; }
  if (G.state!=='gameover') G.state='pitching';
}

// ── Particles ──
function spawnHitParticles(x,y,color) {
  for (let i=0;i<35;i++) {
    const a=Math.random()*Math.PI*2, spd=2+Math.random()*8;
    G.particles.push({ x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-4,color,life:80,maxLife:80,size:3+Math.random()*4 });
  }
}

// ── DRAW ──

function drawStadium() {
  // Sky gradient (day game)
  const sky=ctx.createLinearGradient(0,0,0,DH*0.45);
  sky.addColorStop(0,'#87CEEB'); sky.addColorStop(1,'#C8E8FF');
  ctx.fillStyle=sky; ctx.fillRect(0,0,DW,DH*0.45);

  // Distant stadium walls / upper deck
  ctx.fillStyle='#5a7a9a';
  ctx.fillRect(0,20,DW,140);

  // Upper deck shadow
  const deckGrad=ctx.createLinearGradient(0,20,0,160);
  deckGrad.addColorStop(0,'#3a5a7a'); deckGrad.addColorStop(1,'#6a9aaa');
  ctx.fillStyle=deckGrad;
  ctx.fillRect(0,20,DW,130);

  // Crowd rows (3 tiers)
  for (let row=0;row<5;row++) {
    ctx.fillStyle=row%2===0?'#4a6a8a':'#3a5a7a';
    ctx.fillRect(0, 28+row*22, DW, 22);
  }

  // Draw crowd people
  G.crowd.forEach(p => {
    const bob=Math.sin(Date.now()*0.002+p.wave)*(p.arm?6:1.5);
    // body
    ctx.fillStyle=`hsl(${p.hue},70%,55%)`;
    ctx.fillRect(p.x-p.size/2, p.y-p.size+bob, p.size, p.size*1.4);
    // head
    ctx.fillStyle='#FDBCB4';
    ctx.beginPath(); ctx.arc(p.x, p.y-p.size/2+bob, p.size*0.55,0,6.28); ctx.fill();
    // arm up
    if (p.arm) {
      ctx.fillStyle=`hsl(${p.hue},70%,55%)`;
      ctx.fillRect(p.x-1, p.y-p.size*2.2+bob, 3, p.size*1.2);
    }
  });

  // Scoreboard (top center)
  drawScoreboard();

  // Billboards on outfield wall
  G.stadium.forEach((txt,i)=>{
    const bx=30+i*150, by=155, bw=130, bh=22;
    ctx.fillStyle='#1a2a3a';
    ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle='#FFD700'; ctx.lineWidth=2;
    ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle='#FFD700';
    ctx.font='bold 11px Arial Black';
    ctx.textAlign='center';
    ctx.fillText(txt, bx+bw/2, by+15);
  });

  // Outfield wall
  ctx.fillStyle='#2a4a2a';
  ctx.fillRect(0,178,DW,20);
  ctx.fillStyle='#3a6a3a';
  ctx.fillRect(0,178,DW,8);

  // Warning track
  const wt=ctx.createLinearGradient(0,198,0,218);
  wt.addColorStop(0,'#b8926a'); wt.addColorStop(1,'#8a6a4a');
  ctx.fillStyle=wt; ctx.fillRect(0,198,DW,20);

  // Outfield grass (deep green, perspective)
  const grass=ctx.createLinearGradient(0,215,0,GROUND_Y+60);
  grass.addColorStop(0,'#2d7a2d'); grass.addColorStop(0.5,'#3a9a3a'); grass.addColorStop(1,'#2a6a2a');
  ctx.fillStyle=grass;
  ctx.fillRect(0,215,DW,DH-215);

  // Grass mow stripes
  for (let i=0;i<10;i++) {
    ctx.fillStyle=i%2===0?'rgba(0,0,0,0.06)':'rgba(255,255,255,0.04)';
    ctx.fillRect(0, 215+i*28, DW, 28);
  }

  // Infield dirt circle
  ctx.fillStyle='#c4956a';
  ctx.beginPath();
  ctx.ellipse(DW/2+80, GROUND_Y+30, 280, 80, 0, 0, Math.PI*2);
  ctx.fill();

  // Foul lines
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(BATTER_X+10,GROUND_Y); ctx.lineTo(0,GROUND_Y-60); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(BATTER_X+10,GROUND_Y); ctx.lineTo(DW,GROUND_Y-60); ctx.stroke();

  // Home plate
  ctx.fillStyle='white';
  ctx.beginPath();
  ctx.moveTo(BATTER_X-5,GROUND_Y); ctx.lineTo(BATTER_X+25,GROUND_Y);
  ctx.lineTo(BATTER_X+25,GROUND_Y-10); ctx.lineTo(BATTER_X+10,GROUND_Y-18);
  ctx.lineTo(BATTER_X-5,GROUND_Y-10); ctx.closePath(); ctx.fill();

  // Pitcher mound
  ctx.fillStyle='#b8926a';
  ctx.beginPath(); ctx.ellipse(PITCHER_X,GROUND_Y+5,30,12,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='white';
  ctx.fillRect(PITCHER_X-10,GROUND_Y-4,20,5); // rubber
}

function drawScoreboard() {
  const x=270, y=22, w=260, h=72;
  // Board
  ctx.fillStyle='#111';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=3;
  ctx.strokeRect(x,y,w,h);

  // Title
  ctx.fillStyle='#FFD700';
  ctx.font='bold 10px Arial Black'; ctx.textAlign='center';
  ctx.fillText('BASEBALL BROS', x+w/2, y+12);

  // Innings row
  ctx.fillStyle='#333'; ctx.fillRect(x+2,y+14,w-4,14);
  ctx.fillStyle='#aaa'; ctx.font='9px Arial'; ctx.textAlign='center';
  ctx.fillText('INN', x+28, y+24);
  ctx.fillText('R', x+w-18, y+24);
  for (let i=1;i<=9;i++) {
    ctx.fillText(i, x+28+i*20, y+24);
  }

  // Team rows
  const teams=['HOME','AWAY'];
  teams.forEach((t,ti)=>{
    const ry=y+28+ti*18;
    ctx.fillStyle=ti===0?'rgba(52,152,219,0.3)':'rgba(231,76,60,0.3)';
    ctx.fillRect(x+2,ry,w-4,17);
    ctx.fillStyle='white'; ctx.font='bold 10px Arial Black'; ctx.textAlign='left';
    ctx.fillText(t, x+6, ry+12);
    // Score total
    ctx.fillStyle='#FFD700'; ctx.textAlign='center';
    ctx.fillText(G.score[ti], x+w-18, ry+12);
  });

  // Inning indicator
  ctx.fillStyle='#FFD700'; ctx.font='bold 9px Arial'; ctx.textAlign='center';
  const arrow=G.top?'▲':'▼';
  ctx.fillText(`${arrow}${G.inning}`, x+w/2, y+68);

  // Outs dots
  ctx.fillStyle='#555'; ctx.font='8px Arial'; ctx.textAlign='left';
  ctx.fillText('OUT', x+w-60, y+68);
  for(let i=0;i<3;i++){
    ctx.fillStyle=i<G.outs?'#FF4444':'#444';
    ctx.beginPath(); ctx.arc(x+w-38+i*12,y+64,4,0,6.28); ctx.fill();
  }
}

function drawStrikeZone() {
  const sz=STRIKE_ZONE;
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.5; ctx.setLineDash([4,4]);
  ctx.strokeRect(sz.x,sz.y,sz.w,sz.h);
  ctx.setLineDash([]);
  // count display
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(sz.x-2,sz.y+sz.h+4,sz.w+4,30);
  ctx.fillStyle='white'; ctx.font='bold 9px Arial'; ctx.textAlign='center';
  ctx.fillText(`B:${G.balls}  S:${G.strikes}`, sz.x+sz.w/2, sz.y+sz.h+14);
  // count dots
  for(let i=0;i<4;i++){
    ctx.fillStyle=i<G.balls?'#44FF44':'#444';
    ctx.beginPath(); ctx.arc(sz.x+6+i*10,sz.y+sz.h+24,3.5,0,6.28); ctx.fill();
  }
  for(let i=0;i<3;i++){
    ctx.fillStyle=i<G.strikes?'#FF4444':'#444';
    ctx.beginPath(); ctx.arc(sz.x+sz.w-24+i*10,sz.y+sz.h+24,3.5,0,6.28); ctx.fill();
  }
}

// ── Characters ──
function drawBatter() {
  const x=BATTER_X, y=GROUND_Y;
  const st=G.batterState;
  const bf=G.batterFrame;

  ctx.save(); ctx.translate(x,y);

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(20,0,28,7,0,0,6.28); ctx.fill();

  // Legs
  ctx.fillStyle='#1a3a8a';
  if (st==='swing') {
    const lp=Math.min(bf/12,1);
    ctx.fillRect(0,-70+lp*10, 14, 70-lp*10);
    ctx.fillRect(20,-60, 14, 60);
  } else {
    ctx.fillRect(0,-80, 14, 80);
    ctx.fillRect(20,-80, 14, 80);
  }
  // Shoes
  ctx.fillStyle='#111';
  ctx.fillRect(-2,-6,18,10); ctx.fillRect(18,-6,18,10);

  // Body
  const bodyGrad=ctx.createLinearGradient(-15,-140,15,-140);
  bodyGrad.addColorStop(0,'#1155CC'); bodyGrad.addColorStop(1,'#3377EE');
  ctx.fillStyle=bodyGrad;
  ctx.beginPath(); roundRect(ctx,-14,-80-70,45,70,8); ctx.fill();

  // Stripes
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.fillRect(-8,-150,5,70); ctx.fillRect(0,-150,5,70);

  // Head
  const hx=4, hy=-165;
  ctx.fillStyle='#FDBCB4';
  ctx.beginPath(); ctx.arc(hx,hy,22,0,6.28); ctx.fill();
  // Eyes
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath(); ctx.arc(hx+8,hy-3,4,0,6.28); ctx.fill();
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.arc(hx+10,hy-5,1.5,0,6.28); ctx.fill();
  // Mouth (focused)
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(hx+2,hy+8); ctx.lineTo(hx+12,hy+8); ctx.stroke();
  // Helmet
  ctx.fillStyle='#1a2a8a';
  ctx.beginPath();
  ctx.arc(hx,hy-4,24,Math.PI,0); ctx.fill();
  ctx.fillRect(hx-24,hy-4,48,8);
  // Ear flap
  ctx.fillRect(hx+18,hy-4,10,18);

  // Bat
  let batAngle = -0.3;
  if (st==='swing') { batAngle = -0.3 + (bf/14)*Math.PI*1.4; }
  if (st==='windup') batAngle = -1.1;
  ctx.save();
  ctx.translate(hx-18, hy+20);
  ctx.rotate(batAngle);
  // handle
  ctx.fillStyle='#8B4513';
  ctx.fillRect(-4,0,8,70);
  // barrel
  const barGrad=ctx.createLinearGradient(-9,0,9,0);
  barGrad.addColorStop(0,'#6B3410'); barGrad.addColorStop(0.5,'#C4783A'); barGrad.addColorStop(1,'#6B3410');
  ctx.fillStyle=barGrad;
  ctx.beginPath(); ctx.ellipse(0,0,14,18,0,0,6.28); ctx.fill();
  ctx.fillRect(-9,0,18,35);
  ctx.restore();

  ctx.restore();
  G.batterFrame++;
}

function drawPitcher() {
  const x=PITCHER_X, y=GROUND_Y;
  const st=G.pitcherState;
  const pf=G.pitcherFrame;

  ctx.save(); ctx.translate(x,y); ctx.scale(-1,1); // face left

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0,0,24,6,0,0,6.28); ctx.fill();

  // Legs
  ctx.fillStyle='#8a1a1a';
  if (st==='throw' && pf<12) {
    const p=pf/12;
    ctx.fillRect(0,-70,12,70);
    ctx.save(); ctx.translate(18,-40); ctx.rotate(p*0.6);
    ctx.fillRect(-6,-40,12,50); ctx.restore();
  } else {
    ctx.fillRect(0,-70,12,70); ctx.fillRect(16,-70,12,70);
  }
  ctx.fillStyle='#111';
  ctx.fillRect(-2,-6,16,9); ctx.fillRect(14,-6,16,9);

  // Body
  ctx.fillStyle='#CC2222';
  ctx.beginPath(); roundRect(ctx,-12,-140,40,70,8); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.fillRect(-6,-138,4,68); ctx.fillRect(2,-138,4,68);

  // Throwing arm
  ctx.save();
  const armAngle=st==='throw'? -0.5 + Math.min(pf/10,1)*2.0 : -0.5;
  ctx.translate(28,-120);
  ctx.rotate(armAngle);
  ctx.fillStyle='#FDBCB4'; ctx.fillRect(-5,-30,10,30);
  // Glove (ball hand)
  ctx.fillStyle='#8B4513';
  ctx.beginPath(); ctx.arc(0,-32,9,0,6.28); ctx.fill();
  ctx.restore();

  // Head
  const hx=-2, hy=-168;
  ctx.fillStyle='#FDBCB4';
  ctx.beginPath(); ctx.arc(hx,hy,20,0,6.28); ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath(); ctx.arc(hx+6,hy-2,3.5,0,6.28); ctx.fill();
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.arc(hx+8,hy-4,1.2,0,6.28); ctx.fill();
  // Cap
  ctx.fillStyle='#8a1a1a';
  ctx.beginPath(); ctx.arc(hx,hy-4,22,Math.PI,0); ctx.fill();
  ctx.fillRect(hx-22,hy-4,44,7);
  ctx.fillRect(hx-22,hy-4,34,7); // brim

  ctx.restore();
  G.pitcherFrame++;
}

function drawBall() {
  const b=G.ball; if(!b) return;
  b.spin+=0.22;

  if (b.phase==='pitch') {
    const t=b.frame/b.totalFrames;
    const cx=b.sx+(b.tx-b.sx)*t + b.breakX*Math.sin(t*Math.PI);
    const cy=b.sy+(b.ty-b.sy)*t + b.breakY*Math.sin(t*Math.PI)*30;
    b.x=cx; b.y=cy;
    b.frame++;
    if (b.frame>=b.totalFrames && !G.swingDone) {
      // ball reaches plate, no swing
      if (b.isStrike) {
        G.strikes++;
        G.hitText='STRIKE!'; G.hitTextTimer=55;
        if(G.strikes>=3) doOut('STRIKEOUT!'); else resetAtBat(false);
      } else {
        G.balls++;
        G.hitText='BALL!'; G.hitTextTimer=55;
        if(G.balls>=4){ G.hitText='WALK!'; G.hitTextTimer=75; advanceBases(1); G.strikes=0; G.balls=0; resetAtBat(true); }
        else resetAtBat(false);
      }
    }
    drawBallSprite(b.x,b.y,b.spin, PITCHES[b.pitchIdx].color);
  } else if (b.phase==='hit') {
    b.x+=b.vx; b.y+=b.vy; b.vy+=b.grav;
    drawBallSprite(b.x,b.y,b.spin,'#ffffff');
  }
}

function drawBallSprite(x,y,spin,trailColor) {
  // Trail
  ctx.fillStyle=trailColor+'44';
  ctx.beginPath(); ctx.arc(x-4,y,4,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(x-8,y,2.5,0,6.28); ctx.fill();

  const grd=ctx.createRadialGradient(x-2,y-2,0,x,y,8);
  grd.addColorStop(0,'#ffffff'); grd.addColorStop(1,'#e8e0d0');
  ctx.fillStyle=grd;
  ctx.beginPath(); ctx.arc(x,y,8,0,6.28); ctx.fill();

  ctx.save(); ctx.translate(x,y); ctx.rotate(spin);
  ctx.strokeStyle='#cc3333'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(0,0,6,0.5,2.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,6,Math.PI+0.5,Math.PI+2.5); ctx.stroke();
  ctx.restore();
}

function drawPowerBar(x,y,w,h,value,label,color) {
  // Background
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=2;
  ctx.strokeRect(x,y,w,h);

  // Fill with gradient
  const g2=ctx.createLinearGradient(x,0,x+w,0);
  g2.addColorStop(0,'#22aa22');
  g2.addColorStop(0.6,'#aaaa22');
  g2.addColorStop(0.85,'#aa6622');
  g2.addColorStop(1,'#aa2222');
  ctx.fillStyle=g2;
  ctx.fillRect(x+1,y+1,Math.min(value*(w-2),w-2),h-2);

  // Marker line (sweet spot ~70-90%)
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=2; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(x+w*0.72,y); ctx.lineTo(x+w*0.72,y+h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+w*0.90,y); ctx.lineTo(x+w*0.90,y+h); ctx.stroke();
  ctx.setLineDash([]);

  // Label
  ctx.fillStyle='white'; ctx.font=`bold 11px Arial Black`; ctx.textAlign='center';
  ctx.fillText(label, x+w/2, y-5);

  // RELEASE cue
  if (value>0.68 && value<0.93) {
    ctx.fillStyle='#FFD700'; ctx.font='bold 12px Arial Black';
    ctx.fillText('★ RELEASE! ★', x+w/2, y+h+15);
  }
}

function drawPitchTypeButtons() {
  PITCHES.forEach((p,i)=>{
    const bx=18+i*93, by=450, bw=85, bh=34;
    const sel=G.pitchType===i;
    ctx.fillStyle=sel?p.color+'dd':'rgba(0,0,0,0.6)';
    roundRectFill(ctx,bx,by,bw,bh,6);
    ctx.strokeStyle=sel?'#FFD700':'#555'; ctx.lineWidth=sel?2.5:1.5;
    roundRectStroke(ctx,bx,by,bw,bh,6);
    ctx.fillStyle=sel?'#111':'#aaa';
    ctx.font=`bold ${sel?11:10}px Arial Black`; ctx.textAlign='center';
    ctx.fillText(p.name, bx+bw/2, by+bh/2+4);
  });
  ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='10px Arial'; ctx.textAlign='left';
  ctx.fillText('← → to pick pitch', 18, 444);
}

function drawHitText() {
  if (!G.hitText || G.hitTextTimer<=0) return;
  G.hitTextTimer--;
  const alpha=Math.min(1, G.hitTextTimer/20);
  const scale=1+Math.sin((1-G.hitTextTimer/120)*Math.PI)*0.3;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(DW/2, DH/2-60);
  ctx.scale(scale,scale);
  ctx.font=`bold 48px Arial Black`;
  ctx.textAlign='center';
  ctx.strokeStyle='#000'; ctx.lineWidth=7;
  ctx.strokeText(G.hitText,0,0);
  ctx.fillStyle='#FFD700';
  ctx.fillText(G.hitText,0,0);
  ctx.restore();
}

function drawParticles() {
  G.particles=G.particles.filter(p=>p.life>0);
  G.particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.life-=2;
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,6.28); ctx.fill();
    ctx.globalAlpha=1;
  });
}

function drawBases() {
  // First base (right side of infield)
  const basePositions=[
    {x:360,y:GROUND_Y-18},   // 1st
    {x:280,y:GROUND_Y-55},   // 2nd
    {x:200,y:GROUND_Y-18},   // 3rd (further back visually)
  ];
  basePositions.forEach((bp,i)=>{
    ctx.save(); ctx.translate(bp.x,bp.y); ctx.rotate(Math.PI/5);
    ctx.fillStyle=G.bases[i]?'#FFD700':'white';
    ctx.fillRect(-9,-9,18,18);
    if(G.bases[i]){ctx.strokeStyle='#FFA500';ctx.lineWidth=2;ctx.strokeRect(-9,-9,18,18);}
    ctx.restore();
  });
}

// ── Menu ──
function drawMenu() {
  const bg=ctx.createLinearGradient(0,0,0,DH);
  bg.addColorStop(0,'#001122'); bg.addColorStop(1,'#002244');
  ctx.fillStyle=bg; ctx.fillRect(0,0,DW,DH);

  // Stars
  for(let i=0;i<80;i++){
    const bx=(i*173.7%DW), by=(i*97.3%DH*0.5);
    ctx.fillStyle=`rgba(255,255,255,${0.2+0.5*Math.sin(Date.now()*0.001+i)})`;
    ctx.beginPath(); ctx.arc(bx,by,1.2,0,6.28); ctx.fill();
  }

  // Grass floor
  ctx.fillStyle='#1a5a1a'; ctx.fillRect(0,DH*0.65,DW,DH);
  ctx.fillStyle='#2a7a2a'; ctx.fillRect(0,DH*0.65,DW,12);

  // Draw two big characters
  ctx.save(); ctx.translate(200,DH*0.72); drawMenuCharacter('#1155CC','#1a2a8a',false); ctx.restore();
  ctx.save(); ctx.translate(600,DH*0.72); drawMenuCharacter('#CC2222','#8a1a1a',true); ctx.restore();

  G.menuPulse=(G.menuPulse||0)+0.05;
  const p=Math.sin(G.menuPulse)*4;

  // Logo
  ctx.textAlign='center';
  ctx.font=`bold ${72+p}px Arial Black`;
  ctx.strokeStyle='#002244'; ctx.lineWidth=8;
  ctx.strokeText('BASEBALL', DW/2, 130);
  const logGrad=ctx.createLinearGradient(0,60,0,140);
  logGrad.addColorStop(0,'#FFE033'); logGrad.addColorStop(1,'#FF8800');
  ctx.fillStyle=logGrad;
  ctx.fillText('BASEBALL', DW/2, 130);

  ctx.font=`bold ${56+p}px Arial Black`;
  ctx.strokeStyle='#002244'; ctx.lineWidth=6;
  ctx.strokeText('BROS', DW/2, 190);
  ctx.fillStyle='#FF3333';
  ctx.fillText('BROS', DW/2, 190);

  // Ball
  drawBallSprite(DW/2, 225, Date.now()*0.005,'#FFD700');

  // Play button
  const bw=220,bh=52,bx2=DW/2-bw/2,by2=DH*0.78;
  const btnGrad=ctx.createLinearGradient(bx2,by2,bx2,by2+bh);
  btnGrad.addColorStop(0,'#FF5544'); btnGrad.addColorStop(1,'#CC2222');
  ctx.fillStyle=btnGrad;
  roundRectFill(ctx,bx2,by2,bw,bh,12);
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=3;
  roundRectStroke(ctx,bx2,by2,bw,bh,12);
  ctx.fillStyle='white'; ctx.font='bold 22px Arial Black'; ctx.textAlign='center';
  ctx.fillText('▶  PLAY BALL!', DW/2, by2+bh*0.65);

  ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.font='12px Arial';
  ctx.fillText('Click · ⬆ Arrow · ENTER', DW/2, by2+bh+22);

  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.font='11px Arial';
  ctx.fillText('SPACE = Swing  |  ⬆ = Pitch  |  ← → = Pitch type  |  R = Restart', DW/2, DH-12);
}

function drawMenuCharacter(body,hat,flip) {
  if(flip){ctx.save();ctx.scale(-1,1);}
  // legs
  ctx.fillStyle='#333';
  ctx.fillRect(-12,-80,18,80); ctx.fillRect(10,-80,18,80);
  ctx.fillStyle='#111'; ctx.fillRect(-14,-8,22,12); ctx.fillRect(8,-8,22,12);
  // body
  ctx.fillStyle=body;
  ctx.beginPath(); roundRect(ctx,-18,-160,52,80,10); ctx.fill();
  // head
  ctx.fillStyle='#FDBCB4'; ctx.beginPath(); ctx.arc(8,-175,26,0,6.28); ctx.fill();
  // hat
  ctx.fillStyle=hat;
  ctx.beginPath(); ctx.arc(8,-179,28,Math.PI,0); ctx.fill();
  ctx.fillRect(-20,-179,56,10);
  ctx.fillStyle='#1a1a2e'; ctx.beginPath(); ctx.arc(8+10,-173,5,0,6.28); ctx.fill();
  ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(8+12,-175,2,0,6.28); ctx.fill();
  if(flip){ctx.restore();}
}

// ── Instruction overlay ──
function drawControls() {
  if(G.state==='pitching'){
    ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.font='bold 12px Arial'; ctx.textAlign='center';
    ctx.fillText('Hold ⬆ / SPACE to charge pitch, release to throw!', DW/2, 420);
  }
  if(G.state==='batting'||G.state==='thrown'){
    ctx.fillStyle='rgba(255,255,100,0.85)'; ctx.font='bold 13px Arial Black'; ctx.textAlign='center';
    ctx.strokeStyle='#000'; ctx.lineWidth=3;
    const hint='Hold SPACE to charge swing — release at the right moment!  ← → to aim';
    ctx.strokeText(hint,DW/2,425); ctx.fillText(hint,DW/2,425);
  }
}

// ── roundRect helpers ──
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r); c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h); c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r); c.arcTo(x,y,x+r,y,r);
  c.closePath();
}
function roundRectFill(c,x,y,w,h,r){ roundRect(c,x,y,w,h,r); c.fill(); }
function roundRectStroke(c,x,y,w,h,r){ roundRect(c,x,y,w,h,r); c.stroke(); }

// ── Main loop ──
function loop() {
  requestAnimationFrame(loop);
  if (!G) return;

  ctx.clearRect(0,0,DW,DH);

  if (G.state==='menu') { drawMenu(); return; }

  drawStadium();
  drawBases();
  drawStrikeZone();

  // Power bars
  if (G.state==='pitching') {
    if (G.pitchHeld) {
      G.pitchPower+=G.pitchDir*0.025;
      if(G.pitchPower>=1){G.pitchPower=1;G.pitchDir=-1;}
      if(G.pitchPower<=0){G.pitchPower=0;G.pitchDir=1;}
    }
    drawPitchTypeButtons();
    if (G.pitchHeld) drawPowerBar(50,390,300,28,G.pitchPower,'PITCH POWER','#22aa22');
  }

  if (G.state==='batting'||G.state==='thrown') {
    if(G.state==='thrown') G.state='batting'; // allow batting as soon as ball thrown
    if (G.swingHeld) {
      G.swingPower+=G.swingDir*0.028;
      if(G.swingPower>=1){G.swingPower=1;G.swingDir=-1;}
      if(G.swingPower<=0){G.swingPower=0;G.swingDir=1;}
      drawPowerBar(440,390,300,28,G.swingPower,'SWING POWER','#2244aa');
    }
  }

  drawBatter();
  drawPitcher();
  if(G.ball) drawBall();

  drawParticles();
  drawHitText();
  drawControls();

  // Gameover overlay
  if(G.state==='gameover') {
    ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,DW,DH);
    ctx.fillStyle='#FFD700'; ctx.font='bold 52px Arial Black'; ctx.textAlign='center';
    ctx.strokeStyle='#000'; ctx.lineWidth=8;
    ctx.strokeText('GAME OVER',DW/2,DH/2-30); ctx.fillText('GAME OVER',DW/2,DH/2-30);
    ctx.font='bold 28px Arial Black';
    ctx.strokeText(`HOME ${G.score[0]}  —  AWAY ${G.score[1]}`,DW/2,DH/2+20);
    ctx.fillStyle='white'; ctx.fillText(`HOME ${G.score[0]}  —  AWAY ${G.score[1]}`,DW/2,DH/2+20);
    ctx.font='16px Arial'; ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.fillText('Press R to play again', DW/2, DH/2+65);
  }
}

newGame();
loop();
</script>
